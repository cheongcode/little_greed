{% extends "base.html" %}
{% block content %}
<div class="space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-white">Preflight</h1>
    <button
      hx-post="/preflight/run"
      hx-target="#results"
      hx-swap="innerHTML"
      hx-indicator="#spinner"
      class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded transition">
      Run all checks
    </button>
  </div>

  <div id="spinner" class="htmx-indicator text-gray-500 text-sm">Running checks…</div>

  <div id="results">
    {% if results %}
      {% include "_preflight_results.html" %}
    {% else %}
      <p class="text-gray-500 text-sm">Click "Run all checks" to start.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
